<style>
:root {
  --bg: #F7F6F3;
  --surface: #FFFFFF;
  --surface2: #EEF0F5;
  --border: #DDE0E8;
  --fg: #1A1F2E;
  --fg2: #6B7280;
  --fg3: #9CA3AF;
  --accent: #1B4F72;
  --accent-light: #D6E8F7;
  --accent2: #15803D;
  --accent2-light: #DCFCE7;
  --tag-bg: #EEF0F5;
  --tag-fg: #374151;
  --pill-border: #CBD5E1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1117;
    --surface: #1A1F2E;
    --surface2: #252B3B;
    --border: #2D3447;
    --fg: #E8EAF0;
    --fg2: #9CA3AF;
    --fg3: #6B7280;
    --accent: #3B82F6;
    --accent-light: #1E3A5F;
    --accent2: #22C55E;
    --accent2-light: #14532D;
    --tag-bg: #252B3B;
    --tag-fg: #D1D5DB;
    --pill-border: #374151;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1117;
  --surface: #1A1F2E;
  --surface2: #252B3B;
  --border: #2D3447;
  --fg: #E8EAF0;
  --fg2: #9CA3AF;
  --fg3: #6B7280;
  --accent: #3B82F6;
  --accent-light: #1E3A5F;
  --accent2: #22C55E;
  --accent2-light: #14532D;
  --tag-bg: #252B3B;
  --tag-fg: #D1D5DB;
  --pill-border: #374151;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--fg);
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
/* HEADER */
#header {
  background: var(--accent);
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  flex-shrink: 0;
  z-index: 10;
}
#header h1 {
  color: #fff;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin-bottom: 10px;
}
#search-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
#search {
  flex: 1;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 8px;
  padding: 8px 12px;
  color: #fff;
  font-size: 14px;
  font-family: inherit;
  outline: none;
}
#search::placeholder { color: rgba(255,255,255,0.6); }
#search:focus { background: rgba(255,255,255,0.22); }
#count-badge {
  color: rgba(255,255,255,0.75);
  font-size: 12px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
/* FILTER BAR */
#filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px 16px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  background: var(--tag-bg);
  color: var(--tag-fg);
  border: 1px solid var(--pill-border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
.filter-btn.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
/* ALPHABET BAR */
#alpha-bar {
  display: flex;
  gap: 2px;
  padding: 6px 16px;
  overflow-x: auto;
  scrollbar-width: none;
  flex-shrink: 0;
  background: var(--bg);
}
#alpha-bar::-webkit-scrollbar { display: none; }
.alpha-btn {
  background: transparent;
  color: var(--fg2);
  border: none;
  border-radius: 4px;
  padding: 3px 5px;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  min-width: 20px;
  text-align: center;
}
.alpha-btn:hover { background: var(--surface2); color: var(--fg); }
.alpha-btn.active { background: var(--accent); color: #fff; }
/* MAIN LIST */
#list-container {
  flex: 1;
  overflow-y: auto;
  padding: 8px 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}
.alpha-group { margin-bottom: 20px; }
.alpha-header {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--fg3);
  padding: 6px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
  position: sticky;
  top: 0;
  background: var(--bg);
}
.entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.entry-main {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.entry-en {
  font-weight: 600;
  font-size: 14px;
  color: var(--fg);
  flex: 1;
}
.cat-tag {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  white-space: nowrap;
  flex-shrink: 0;
}
.cat-connector { background: var(--accent-light); color: var(--accent); }
.cat-graph { background: #FEF3C7; color: #92400E; }
.cat-verb-prep { background: #FCE7F3; color: #9D174D; }
.cat-phrase { background: var(--accent2-light); color: var(--accent2); }
.cat-grammar { background: #F3E8FF; color: #6B21A8; }
.cat-register { background: #FEF9EC; color: #854D0E; }
.cat-general { background: #F1F5F9; color: #475569; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .cat-graph { background: #3D2E00; color: #FCD34D; }
  :root:not([data-theme="light"]) .cat-verb-prep { background: #3D0028; color: #F9A8D4; }
  :root:not([data-theme="light"]) .cat-grammar { background: #2D1758; color: #D8B4FE; }
  :root:not([data-theme="light"]) .cat-register { background: #3D2200; color: #FDE68A; }
  :root:not([data-theme="light"]) .cat-general { background: #1E2530; color: #94A3B8; }
}
:root[data-theme="dark"] .cat-graph { background: #3D2E00; color: #FCD34D; }
:root[data-theme="dark"] .cat-verb-prep { background: #3D0028; color: #F9A8D4; }
:root[data-theme="dark"] .cat-grammar { background: #2D1758; color: #D8B4FE; }
:root[data-theme="dark"] .cat-register { background: #3D2200; color: #FDE68A; }
:root[data-theme="dark"] .cat-general { background: #1E2530; color: #94A3B8; }
.entry-es {
  font-size: 13px;
  color: var(--accent);
  font-weight: 500;
}
.entry-note {
  font-size: 12px;
  color: var(--fg2);
  font-style: italic;
}
.highlight { background: #FEF08A; color: #713F12; border-radius: 2px; padding: 0 1px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .highlight { background: #713F12; color: #FEF08A; }
}
:root[data-theme="dark"] .highlight { background: #713F12; color: #FEF08A; }
#empty {
  text-align: center;
  color: var(--fg2);
  padding: 60px 16px;
  font-size: 15px;
}
/* theme toggle */
#theme-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 6px;
  color: #fff;
  font-size: 14px;
  padding: 6px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
</style>
</head>
<body>
<div id="header">
  <h1>🇪🇸 Spanish Dictionary — UNLPE ONU III</h1>
  <div id="search-row">
    <input id="search" type="search" placeholder="Search English or Spanish…" autocomplete="off" autocorrect="off" spellcheck="false">
    <span id="count-badge">— entries</span>
    <button id="theme-btn" onclick="cycleTheme()" title="Toggle theme">☀</button>
  </div>
</div>
<div id="filter-bar">
  <button class="filter-btn active" data-cat="all" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" data-cat="connector" onclick="setFilter('connector',this)">Connectors</button>
  <button class="filter-btn" data-cat="graph" onclick="setFilter('graph',this)">Graph vocab</button>
  <button class="filter-btn" data-cat="verb-prep" onclick="setFilter('verb-prep',this)">Verb + prep</button>
  <button class="filter-btn" data-cat="phrase" onclick="setFilter('phrase',this)">Phrases</button>
  <button class="filter-btn" data-cat="grammar" onclick="setFilter('grammar',this)">Grammar</button>
  <button class="filter-btn" data-cat="register" onclick="setFilter('register',this)">Register / Email</button>
  <button class="filter-btn" data-cat="general" onclick="setFilter('general',this)">General vocab</button>
</div>
<div id="alpha-bar"></div>
<div id="list-container"></div>

const THEME_KEY = 'dict-theme';
function cycleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'system';
  const next = cur === 'system' ? 'dark' : cur === 'dark' ? 'light' : 'system';
  if (next === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀' : next === 'light' ? '🌙' : '☀';
  try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
}
try {
  const t = localStorage.getItem(THEME_KEY);
  if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
} catch(e) {}

// ===== STATE =====
let currentFilter = 'all';
let currentAlpha = 'all';
let searchTerm = '';

const catLabels = {
  connector: 'Connector',
  graph: 'Graph vocab',
  'verb-prep': 'Verb + prep',
  phrase: 'Phrase',
  grammar: 'Grammar',
  register: 'Register',
  general: 'General'
};

function catClass(cat) {
  return 'cat-' + cat;
}

function getFiltered() {
  let data = VOCAB;
  if (currentFilter !== 'all') data = data.filter(e => e.cat === currentFilter);
  if (currentAlpha !== 'all') {
    data = data.filter(e => e.en.charAt(0).toLowerCase() === currentAlpha);
  }
  if (searchTerm) {
    const q = searchTerm.toLowerCase();
    data = data.filter(e =>
      e.en.toLowerCase().includes(q) ||
      e.es.toLowerCase().includes(q) ||
      (e.note && e.note.toLowerCase().includes(q))
    );
  }
  return data.sort((a, b) => a.en.localeCompare(b.en));
}

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function buildAlphaBar() {
  const bar = document.getElementById('alpha-bar');
  const letters = [...new Set(VOCAB.map(e => e.en.charAt(0).toLowerCase()))].sort();
  let html = `<button class="alpha-btn ${currentAlpha==='all'?'active':''}" onclick="setAlpha('all',this)">All</button>`;
  letters.forEach(l => {
    html += `<button class="alpha-btn ${currentAlpha===l?'active':''}" onclick="setAlpha('${l}',this)">${l.toUpperCase()}</button>`;
  });
  bar.innerHTML = html;
}

function render() {
  const data = getFiltered();
  const q = searchTerm.toLowerCase();
  document.getElementById('count-badge').textContent = data.length + ' entries';

  const list = document.getElementById('list-container');

  if (data.length === 0) {
    list.innerHTML = '<div id="empty">No entries found. Try a different search or filter.</div>';
    return;
  }

  // Group by first letter
  const groups = {};
  data.forEach(e => {
    const l = e.en.charAt(0).toUpperCase();
    if (!groups[l]) groups[l] = [];
    groups[l].push(e);
  });

  let html = '';
  Object.keys(groups).sort().forEach(letter => {
    html += `<div class="alpha-group">`;
    html += `<div class="alpha-header">${letter}</div>`;
    groups[letter].forEach(e => {
      const enH = highlight(e.en, q);
      const esH = highlight(e.es, q);
      const noteH = e.note ? highlight(e.note, q) : '';
      html += `<div class="entry">
        <div class="entry-main">
          <span class="entry-en">${enH}</span>
          <span class="cat-tag ${catClass(e.cat)}">${catLabels[e.cat]}</span>
        </div>
        <div class="entry-es">${esH}</div>
        ${e.note ? `<div class="entry-note">${noteH}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  });
  list.innerHTML = html;
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentAlpha = 'all';
  buildAlphaBar();
  render();
}

function setAlpha(l, btn) {
  currentAlpha = l;
  document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.trim();
  currentAlpha = 'all';
  buildAlphaBar();
  render();
});

buildAlphaBar();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/SpanishDict/sw.js').catch(() => {});
}
