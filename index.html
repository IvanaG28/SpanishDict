#alpha-bar::-webkit-scrollbar { display: none; }
.ab {

  position: sticky;
  top: 0;
  background: #F7F6F3;
}
.entry {

#empty {

let alpha = 'all';
let q = '';

function getFiltered() {
  let data = VOCAB;
  if (alpha !== 'all') data = data.filter(e => e.en.charAt(0).toLowerCase() === alpha);
  if (q) {
    const lq = q.toLowerCase();
    data = data.filter(e => e.en.toLowerCase().includes(lq) || e.es.toLowerCase().includes(lq));
  }
  return data.slice().sort((a,b) => a.en.localeCompare(b.en, undefined, {sensitivity:'base'}));
}

function hl(text, q) {
  if (!q) return text;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return text.replace(re, '<span class="hl">$1</span>');
}

function buildAlpha() {
  const letters = [...new Set(VOCAB.map(e => e.en.charAt(0).toLowerCase()))].sort();
  const bar = document.getElementById('alpha-bar');
  let html = `<button class="ab ${alpha==='all'?'on':''}" onclick="setAlpha('all',this)">All</button>`;
  letters.forEach(l => {
    html += `<button class="ab ${alpha===l?'on':''}" onclick="setAlpha('${l}',this)">${l.toUpperCase()}</button>`;
  });
  bar.innerHTML = html;
}

function render() {
  const data = getFiltered();
  document.getElementById('count').textContent = data.length + ' entries';
  const list = document.getElementById('list');
  if (!data.length) { list.innerHTML = '<div id="empty">No entries found.</div>'; return; }
  const groups = {};
  data.forEach(e => {
    const l = e.en.charAt(0).toUpperCase();
    if (!groups[l]) groups[l] = [];
    groups[l].push(e);
  });
  let html = '';
  Object.keys(groups).sort().forEach(letter => {
    html += `<div class="grp"><div class="alpha-header">${letter}</div>`;
    groups[letter].forEach(e => {
      html += `<div class="entry"><div class="entry-en">${hl(e.en,q)}</div><div class="entry-es">${hl(e.es,q)}</div></div>`;
    });
    html += '</div>';
  });
  list.innerHTML = html;
}

function setAlpha(l, btn) {
  alpha = l;
  document.querySelectorAll('.ab').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

document.getElementById('search').addEventListener('input', e => {
  q = e.target.value.trim();
  alpha = 'all';
  buildAlpha();
  render();
});

buildAlpha();
render();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/SpanishDict/sw.js').catch(()=>{});
}
